<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- ===== BLACK BULL PRISON — low-poly bull mark ===== -->
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c323b"/>
      <stop offset="1" stop-color="#222831"/>
    </linearGradient>
    <linearGradient id="hornL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6244"/>
      <stop offset="1" stop-color="#5a3d28"/>
    </linearGradient>
    <linearGradient id="hornR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6244"/>
      <stop offset="1" stop-color="#5a3d28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf63"/>
      <stop offset="1" stop-color="#b8902a"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="200" height="200" rx="20" fill="url(#bgg)"/>
  <circle cx="100" cy="98" r="82" stroke="#161a20" stroke-width="2.5" opacity="0.7"/>

  <!-- ===== HORNS ===== -->
  <!-- left horn -->
  <path d="M70 64 L60 60 L34 40 L20 44 L30 66 L52 78 L70 78 Z" fill="url(#hornL)"/>
  <path d="M70 64 L60 60 L34 40 L20 44 L26 52 L50 66 L70 70 Z" fill="#6b4a33"/>
  <!-- right horn -->
  <path d="M130 64 L140 60 L166 40 L180 44 L170 66 L148 78 L130 78 Z" fill="url(#hornR)"/>
  <path d="M130 64 L140 60 L166 40 L180 44 L174 52 L150 66 L130 70 Z" fill="#6b4a33"/>

  <!-- ===== BLACK HIDE / SHOULDERS ===== -->
  <path d="M52 78 L40 96 L34 140 L48 158 L72 150 L72 86 Z" fill="#1c1f24"/>
  <path d="M148 78 L160 96 L166 140 L152 158 L128 150 L128 86 Z" fill="#1c1f24"/>
  <path d="M72 86 L72 160 L100 168 L128 160 L128 86 L100 92 Z" fill="#24282f"/>
  <!-- shoulder shading -->
  <path d="M40 96 L34 140 L48 158 L44 120 Z" fill="#15181c"/>
  <path d="M160 96 L166 140 L152 158 L156 120 Z" fill="#15181c"/>

  <!-- ===== MUZZLE / FACE BOX ===== -->
  <rect x="70" y="44" width="60" height="56" rx="3" fill="#7a5538"/>
  <path d="M70 44 L130 44 L130 100 L70 100 Z" fill="#6b4a33" opacity="0.0"/>
  <path d="M130 44 L130 100 L114 100 L114 44 Z" fill="#5f4129" opacity="0.55"/>
  <path d="M70 44 L130 44 L122 52 L78 52 Z" fill="#8a6244" opacity="0.7"/>

  <!-- eyes -->
  <path d="M84 70 L94 70 L92 80 L84 80 Z" fill="#15110c"/>
  <path d="M116 70 L106 70 L108 80 L116 80 Z" fill="#15110c"/>

  <!-- dark snout block -->
  <path d="M82 92 L118 92 L112 122 L100 128 L88 122 Z" fill="#1c1f24"/>
  <path d="M88 100 L112 100 L108 118 L100 122 L92 118 Z" fill="#15181c"/>

  <!-- ===== GOLD NOSE RING ===== -->
  <circle cx="100" cy="116" r="15" stroke="url(#gold)" stroke-width="6" fill="none"/>
  <circle cx="100" cy="101" r="3.4" fill="#c9a23c"/>

  <!-- ===== HARNESS PLATE + RED S ===== -->
  <path d="M82 132 L118 132 L114 150 L100 156 L86 150 Z" fill="#2a2118"/>
  <path d="M82 132 L118 132 L116 138 L84 138 Z" fill="#3a2c1e"/>
  <!-- red S emblem -->
  <path d="M104 140 L96 140 L93 144 L100 147 L94 150 L96 154 L104 154 L107 150 L100 147 L106 144 Z" fill="#cf3026"/>
</svg>
